<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="description" content="Dashboard financeiro pessoal">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Finanças Pessoais</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root{--bg:#0a0a0f;--sf:#111118;--sf2:#1a1a24;--bd:rgba(255,255,255,0.07);--bd2:rgba(255,255,255,0.12);--tx:#f0f0f5;--mu:#6b6b80;--gr:#00e5a0;--gr2:rgba(0,229,160,0.1);--rd:#ff4d6d;--rd2:rgba(255,77,109,0.1);--bl:#4d9fff;--bl2:rgba(77,159,255,0.1);--am:#ffb347;--am2:rgba(255,179,71,0.1);--pu:#b47aff;--pu2:rgba(180,122,255,0.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh}
.app{max-width:1200px;margin:0 auto;padding:2rem 1.5rem}
.hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;gap:1rem;flex-wrap:wrap}
.hdr-lbl{font-size:11px;letter-spacing:.15em;color:var(--mu);text-transform:uppercase;margin-bottom:4px;font-family:'DM Mono',monospace}
.hdr-ttl{font-size:26px;font-weight:600;letter-spacing:-.02em}
.hdr-sub{font-size:13px;color:var(--mu);margin-top:4px}
.hdr-sub a{color:var(--gr);cursor:pointer;text-decoration:none}
.mnav{display:flex;align-items:center;gap:10px;background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:8px 14px}
.mbtn{background:none;border:none;color:var(--mu);cursor:pointer;font-size:20px;padding:2px 6px;border-radius:6px;transition:all .15s}
.mbtn:hover{color:var(--tx);background:var(--sf2)}
.mlbl{font-family:'DM Mono',monospace;font-size:13px;min-width:130px;text-align:center;letter-spacing:.05em}
.load{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;gap:16px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin:0 3px;animation:pulse 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s;background:var(--bl)}
.dot:nth-child(3){animation-delay:.4s;background:var(--pu)}
@keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.ltx{font-family:'DM Mono',monospace;font-size:12px;color:var(--mu);letter-spacing:.1em}
.setup{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:2rem;max-width:560px;margin:0 auto}
.setup h2{font-size:18px;font-weight:500;margin-bottom:8px}
.setup p{font-size:13px;color:var(--mu);margin-bottom:1.5rem;line-height:1.6}
.irow{display:flex;gap:8px}
.ainp{flex:1;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;padding:10px 14px;color:var(--tx);font-size:13px;font-family:'DM Mono',monospace;outline:none;transition:border .2s}
.ainp:focus{border-color:var(--gr)}
.ainp::placeholder{color:var(--mu)}
.btn{background:var(--gr);color:#000;border:none;border-radius:10px;padding:10px 20px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s;white-space:nowrap}
.btn:hover{opacity:.85}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:1.5rem}
@media(max-width:768px){.cards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.cards{grid-template-columns:1fr}}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:1.25rem;position:relative;overflow:hidden;transition:border-color .2s}
.card:hover{border-color:var(--bd2)}
.cac{position:absolute;top:0;left:0;right:0;height:2px}
.clbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-family:'DM Mono',monospace;margin-bottom:10px}
.cval{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1}
.csub{font-size:11px;color:var(--mu);margin-top:8px;font-family:'DM Mono',monospace}
.gr .cval{color:var(--gr)} .gr .cac{background:var(--gr)}
.rd .cval{color:var(--rd)} .rd .cac{background:var(--rd)}
.bl .cval{color:var(--bl)} .bl .cac{background:var(--bl)}
.am .cval{color:var(--am)} .am .cac{background:var(--am)}
.rbar{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:1.25rem 1.5rem;margin-bottom:1.5rem}
.rbh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.slbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);font-family:'DM Mono',monospace}
.rtrk{background:var(--sf2);border-radius:99px;height:6px;overflow:hidden;display:flex}
.rin{background:var(--gr);height:6px;border-radius:99px 0 0 99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.rout{background:var(--rd);height:6px;transition:width .8s cubic-bezier(.4,0,.2,1);opacity:.7}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1.5rem}
@media(max-width:700px){.cgrid{grid-template-columns:1fr}}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:1.25rem}
.bxh{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:8px}

/* LINHAS DE CATEGORIA COM META */
.hbr{display:flex;align-items:center;gap:8px;margin-bottom:14px;position:relative}
.hbl{font-size:12px;color:var(--mu);width:86px;text-align:right;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-center{flex:1;min-width:0}
.hbt{background:var(--sf2);border-radius:99px;height:5px;position:relative;overflow:visible}
.hbf{height:5px;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1);position:relative;z-index:1}
/* linha de meta */
.meta-line{position:absolute;top:-3px;width:2px;height:11px;background:rgba(255,255,255,0.35);border-radius:2px;z-index:2;pointer-events:none}
.hb-right{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:120px;justify-content:flex-end}
.hbv{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace;text-align:right}
.pct-badge{font-size:10px;font-family:'DM Mono',monospace;padding:2px 6px;border-radius:6px;font-weight:500}
.pct-ok{background:rgba(0,229,160,.12);color:var(--gr)}
.pct-warn{background:rgba(255,179,71,.15);color:var(--am)}
.pct-over{background:rgba(255,77,109,.15);color:var(--rd)}
.pct-neu{background:var(--sf2);color:var(--mu)}
/* botão de meta */
.meta-btn{background:none;border:none;cursor:pointer;color:var(--mu);font-size:12px;padding:2px 4px;border-radius:4px;transition:color .15s;line-height:1;flex-shrink:0}
.meta-btn:hover{color:var(--tx)}
/* input de meta inline */
.meta-inp{background:var(--sf2);border:1px solid var(--bd2);border-radius:6px;color:var(--tx);font-size:11px;font-family:'DM Mono',monospace;padding:3px 6px;width:72px;outline:none}
.meta-inp:focus{border-color:var(--gr)}
.meta-val{font-size:10px;font-family:'DM Mono',monospace;color:var(--mu)}

/* FORMA DE PAGAMENTO (sem meta) */
.hbr-pag{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.hbt-pag{flex:1;background:var(--sf2);border-radius:99px;height:5px}
.hbf-pag{height:5px;border-radius:99px;transition:width .8s cubic-bezier(.4,0,.2,1)}
.hbr-pag .hbv{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace;width:80px;text-align:right;flex-shrink:0}
.hbr-pag .hbl{font-size:12px;color:var(--mu);width:86px;text-align:right;flex-shrink:0}
.pag-right{display:flex;align-items:center;gap:6px;flex-shrink:0;min-width:120px;justify-content:flex-end}

.eleg{display:flex;gap:16px;flex-wrap:wrap}
.eli{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu);font-family:'DM Mono',monospace}
.eld{width:8px;height:8px;border-radius:2px}
.tabs{display:flex;gap:4px;background:var(--sf2);border-radius:10px;padding:3px;margin-bottom:1rem}
.tab{flex:1;text-align:center;padding:6px;font-size:12px;border-radius:7px;cursor:pointer;color:var(--mu);font-family:'DM Mono',monospace;transition:all .2s;border:none;background:none}
.tab.active{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.txn-scroll{max-height:520px;overflow-y:auto;padding-right:4px}
.txn-scroll::-webkit-scrollbar{width:4px}
.txn-scroll::-webkit-scrollbar-track{background:var(--sf2);border-radius:99px}
.txn-scroll::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:99px}
.txn-scroll::-webkit-scrollbar-thumb:hover{background:var(--mu)}
.txn-list{display:flex;flex-direction:column;gap:4px}
.txi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;transition:background .15s}
.txi:hover{background:var(--sf2)}
.txi.proj{opacity:.65;border-left:2px solid var(--am);padding-left:10px}
.txic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.txif{flex:1;min-width:0}
.txin{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txim{font-size:11px;color:var(--mu);font-family:'DM Mono',monospace;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.txia{font-size:14px;font-weight:600;font-family:'DM Mono',monospace;flex-shrink:0}
.txia.out{color:var(--rd)} .txia.in{color:var(--gr)}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:99px;font-family:'DM Mono',monospace}
.ppix{background:rgba(0,229,160,.12);color:var(--gr)}
.pcredito,.pcrédito{background:var(--bl2);color:var(--bl)}
.pdebito,.pdébito{background:var(--am2);color:var(--am)}
.pdinheiro{background:var(--pu2);color:var(--pu)}
.pproj{background:rgba(255,179,71,.12);color:var(--am)}
.nd{font-size:13px;color:var(--mu);text-align:center;padding:2rem 0;font-family:'DM Mono',monospace}
.pal{background:rgba(255,179,71,.08);border:1px solid rgba(255,179,71,.2);border-radius:12px;padding:12px 16px;margin-bottom:1.5rem;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--am)}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--sf2);border:1px solid var(--bd2);border-radius:12px;padding:12px 18px;font-size:13px;z-index:999;opacity:0;transform:translateY(10px);transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateY(0)}
.meta-hint{font-size:10px;color:var(--mu);font-family:'DM Mono',monospace;margin-top:-8px;margin-bottom:10px;opacity:.7}
</style>
</head>
<body>
<div class="app"><div id="root"></div></div>
<div class="toast" id="toast"></div>
<script>
const MES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MSH=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const CC=['#00e5a0','#4d9fff','#ff4d6d','#ffb347','#b47aff','#ff6b9d','#36d7b7','#ffd93d','#a0c4ff','#caffbf'];
const PC={'pix':'#00e5a0','crédito':'#4d9fff','credito':'#4d9fff','débito':'#ffb347','debito':'#ffb347','dinheiro':'#b47aff'};

let API='',all=[],proj=[],curM=new Date().getMonth(),curY=new Date().getFullYear(),tab='reais',ec=null;
let metas=JSON.parse(localStorage.getItem('finMetas')||'{}');
let editingMeta=null;

const R=document.getElementById('root');
const fmt=v=>'R$\u00a0'+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const pd=s=>{if(!s)return null;const p=s.split('/');return p.length===3?new Date(+p[2],+p[1]-1,+p[0]):new Date(s)};
const toast=m=>{const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)};

function saveMeta(cat,val){
  const v=parseFloat(val);
  if(!isNaN(v)&&v>0) metas[cat]=v; else delete metas[cat];
  localStorage.setItem('finMetas',JSON.stringify(metas));
  editingMeta=null;
  renderCats();
}

function startEditMeta(cat){
  editingMeta=cat;
  renderCats();
  setTimeout(()=>{
    const inp=document.getElementById('mi-'+cat.replace(/\s/g,'_'));
    if(inp){inp.focus();inp.select();}
  },50);
}

function renderCats(){
  const el=document.getElementById('cat-section');
  if(!el)return;
  el.innerHTML=buildCatHTML();
}

function buildCatHTML(){
  const rows=gm(curM,curY);
  const sai=rows.filter(r=>r.tipo==='Saída');
  const tOut=sai.reduce((s,r)=>s+r.valor,0);
  const cats={};
  sai.forEach(r=>{cats[r.categoria]=(cats[r.categoria]||0)+r.valor});
  const catE=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  if(catE.length===0) return '<div class="nd">sem dados</div>';

  return catE.map(([c,v],i)=>{
    const pctTotal=tOut>0?Math.round(v/tOut*100):0;
    const meta=metas[c];
    const isEditing=editingMeta===c;
    const catId=c.replace(/\s/g,'_');
    const color=CC[i%CC.length];

    let metaLineHTML='', badgeHTML='', metaAreaHTML='';

    if(meta){
      const pctMeta=Math.round(v/meta*100);
      const barPct=Math.min(Math.round(v/meta*100),100);
      let bcls='pct-ok';
      if(pctMeta>=100) bcls='pct-over';
      else if(pctMeta>=80) bcls='pct-warn';
      // linha de meta na barra (sempre em 100% do track = meta)
      const metaPos=Math.min(Math.round(meta/Math.max(v,meta)*100),100);
      metaLineHTML=`<div class="meta-line" style="left:${metaPos}%"></div>`;
      badgeHTML=`<span class="pct-badge ${bcls}">${pctMeta}% meta</span>`;
      metaAreaHTML=isEditing
        ?`<input class="meta-inp" id="mi-${catId}" value="${meta}"
            onblur="saveMeta('${c}',this.value)"
            onkeydown="if(event.key==='Enter')saveMeta('${c}',this.value);if(event.key==='Escape'){editingMeta=null;renderCats();}"
          />`
        :`<span class="meta-val" style="cursor:pointer" onclick="startEditMeta('${c}')">${fmt(meta)}</span>`;
    } else {
      badgeHTML=`<span class="pct-badge pct-neu">${pctTotal}%</span>`;
      metaAreaHTML=isEditing
        ?`<input class="meta-inp" id="mi-${catId}" placeholder="meta R$" 
            onblur="saveMeta('${c}',this.value)"
            onkeydown="if(event.key==='Enter')saveMeta('${c}',this.value);if(event.key==='Escape'){editingMeta=null;renderCats();}"
          />`
        :`<button class="meta-btn" onclick="startEditMeta('${c}')" title="Definir meta">＋ meta</button>`;
    }

    const maxVal=catE[0][1];
    const barW=meta?Math.min(Math.round(v/meta*100),100):Math.round(v/maxVal*100);
    const barColor=meta?(v>=meta?'var(--rd)':v/meta>=0.8?'var(--am)':color):color;

    return `<div class="hbr">
      <div class="hbl" title="${c}">${c}</div>
      <div class="hb-center">
        <div class="hbt">
          <div class="hbf" style="width:${barW}%;background:${barColor}"></div>
          ${metaLineHTML}
        </div>
      </div>
      <div class="hb-right">
        <div class="hbv">${fmt(v)}</div>
        ${badgeHTML}
        ${metaAreaHTML}
      </div>
    </div>`;
  }).join('');
}

function buildPagHTML(){
  const rows=gm(curM,curY);
  const sai=rows.filter(r=>r.tipo==='Saída');
  const tOut=sai.reduce((s,r)=>s+r.valor,0);
  const pags={};
  sai.forEach(r=>{const p=(r.pagamento||'').toLowerCase();pags[p]=(pags[p]||0)+r.valor});
  const pagE=Object.entries(pags).sort((a,b)=>b[1]-a[1]);
  if(pagE.length===0) return '<div class="nd">sem dados</div>';
  return pagE.map(([p,v])=>{
    const pct=tOut>0?Math.round(v/tOut*100):0;
    return `<div class="hbr-pag">
      <div class="hbl">${p}</div>
      <div class="hbt-pag"><div class="hbf-pag" style="width:${Math.round(v/pagE[0][1]*100)}%;background:${PC[p]||'#888'}"></div></div>
      <div class="pag-right">
        <div class="hbv">${fmt(v)}</div>
        <span class="pct-badge pct-neu">${pct}%</span>
      </div>
    </div>`;
  }).join('');
}

function showSetup(){
  R.innerHTML=`<div style="min-height:80vh;display:flex;flex-direction:column;justify-content:center">
    <div class="setup">
      <div style="font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--mu);text-transform:uppercase;margin-bottom:8px">Configuração</div>
      <h2>Conectar à planilha</h2>
      <p>Cole a URL gerada pelo Apps Script ao implantar como App da Web.<br>
      <code style="color:var(--gr);font-family:'DM Mono',monospace;font-size:12px">https://script.google.com/macros/s/.../exec</code></p>
      <div class="irow">
        <input class="ainp" id="ai" placeholder="https://script.google.com/macros/s/.../exec"/>
        <button class="btn" onclick="conectar()">Conectar</button>
      </div>
      <div style="font-size:11px;color:var(--mu);margin-top:10px;font-family:'DM Mono',monospace">Acesso deve ser <strong>Qualquer pessoa</strong> na implantação.</div>
    </div>
  </div>`;
}

function showLoad(){
  R.innerHTML=`<div class="load">
    <div><span class="dot" style="background:var(--gr)"></span><span class="dot"></span><span class="dot"></span></div>
    <div class="ltx">buscando dados...</div>
  </div>`;
}

async function conectar(){
  const u=document.getElementById('ai')?.value?.trim();
  if(!u)return;
  API=u;localStorage.setItem('finApi',u);
  await load();
}

async function load(){
  showLoad();
  try{
    const r=await fetch(API);
    const j=await r.json();
    all=j.transacoes||[];proj=j.projetadas||[];
    render();
  }catch(e){
    R.innerHTML=`<div class="load">
      <div style="color:var(--rd);font-size:14px">Erro ao conectar</div>
      <div class="ltx">${e.message}</div>
      <button class="btn" onclick="API='';showSetup()" style="margin-top:1rem">Reconfigurar</button>
    </div>`;
  }
}

function gm(m,y,p=false){
  return(p?proj:all).filter(t=>{const d=pd(t.data);return d&&d.getMonth()===m&&d.getFullYear()===y});
}

function render(){
  const rows=gm(curM,curY),projs=gm(curM,curY,true);
  const ent=rows.filter(r=>r.tipo==='Entrada'),sai=rows.filter(r=>r.tipo==='Saída');
  const tIn=ent.reduce((s,r)=>s+r.valor,0),tOut=sai.reduce((s,r)=>s+r.valor,0);
  const saldo=tIn-tOut,tOutP=tOut+projs.reduce((s,r)=>s+r.valor,0);
  const tot=tIn+tOut,pIn=tot>0?Math.round(tIn/tot*100):0,pOut=tot>0?Math.round(tOut/tot*100):0;
  const sc=saldo>=0?'bl':'rd';

  const allTxn=tab==='reais'
    ?[...rows].sort((a,b)=>pd(b.data)-pd(a.data))
    :[...rows,...projs.map(p=>({...p,_proj:true}))].sort((a,b)=>pd(a.data)-pd(b.data));

  const txnHTML=allTxn.length===0?'<div class="nd">nenhuma transação neste mês</div>':allTxn.map(r=>{
    const isIn=r.tipo==='Entrada',isP=!!r._proj||!!r.projetada;
    const pk=(r.pagamento||'').toLowerCase().replace('é','e').replace('ê','e');
    return `<div class="txi${isP?' proj':''}">
      <div class="txic" style="background:${isP?'var(--am2)':isIn?'var(--gr2)':'var(--rd2)'}">
        <span style="color:${isP?'var(--am)':isIn?'var(--gr)':'var(--rd)'}">${isP?'◷':isIn?'↑':'↓'}</span>
      </div>
      <div class="txif">
        <div class="txin">${r.descricao}</div>
        <div class="txim">
          <span>${r.data}</span><span>${r.categoria}</span>
          <span class="pill p${pk}">${r.pagamento}</span>
          ${isP?'<span class="pill pproj">projetada</span>':''}
          ${r.parcelas>1&&!isP?`<span>${r.parcela_atual||''}/${r.parcelas}x</span>`:''}
        </div>
      </div>
      <div class="txia ${isIn?'in':'out'}">${isIn?'+':'-'}${fmt(r.valor)}</div>
    </div>`;
  }).join('');

  R.innerHTML=`
    <div class="hdr">
      <div>
        <div class="hdr-lbl">Dashboard Financeiro</div>
        <div class="hdr-ttl">Visão do mês</div>
        <div class="hdr-sub">${rows.length} transações · <a onclick="recarregar()">↻ atualizar</a> · <span style="cursor:pointer" onclick="API='';showSetup()">reconfigurar</span></div>
      </div>
      <div class="mnav">
        <button class="mbtn" onclick="chM(-1)">‹</button>
        <div class="mlbl">${MES[curM].toUpperCase()} ${curY}</div>
        <button class="mbtn" onclick="chM(1)">›</button>
      </div>
    </div>

    ${projs.length>0?`<div class="pal">⚠ ${projs.length} parcela(s) projetada(s) · estimativa adicional: ${fmt(projs.reduce((s,r)=>s+r.valor,0))}</div>`:''}

    <div class="cards">
      <div class="card gr"><div class="cac"></div><div class="clbl">Entradas</div><div class="cval">${fmt(tIn)}</div><div class="csub">${ent.length} transação(ões)</div></div>
      <div class="card rd"><div class="cac"></div><div class="clbl">Saídas reais</div><div class="cval">${fmt(tOut)}</div><div class="csub">${sai.length} transação(ões)</div></div>
      <div class="card ${sc}"><div class="cac"></div><div class="clbl">Saldo</div><div class="cval">${saldo>=0?'+':'-'} ${fmt(saldo)}</div><div class="csub">${saldo>=0?'positivo':'negativo'} no mês</div></div>
      <div class="card am"><div class="cac"></div><div class="clbl">Saídas + parcelas</div><div class="cval" style="font-size:18px">${fmt(tOutP)}</div><div class="csub">${projs.length} parcelas projetadas</div></div>
    </div>

    <div class="rbar">
      <div class="rbh">
        <div class="slbl">Proporção entradas vs saídas</div>
        <div style="display:flex;gap:16px">
          <span style="font-size:12px;font-family:'DM Mono',monospace;color:var(--gr)">${pIn}% entradas</span>
          <span style="font-size:12px;font-family:'DM Mono',monospace;color:var(--rd)">${pOut}% saídas</span>
        </div>
      </div>
      <div class="rtrk"><div class="rin" style="width:${pIn}%"></div><div class="rout" style="width:${pOut}%"></div></div>
    </div>

    <div class="cgrid">
      <div class="box">
        <div class="bxh">
          <div class="slbl">Gastos por categoria</div>
          <div style="font-size:10px;color:var(--mu);font-family:'DM Mono',monospace">% do total · clique em ＋ meta para definir limite</div>
        </div>
        <div id="cat-section">${buildCatHTML()}</div>
      </div>
      <div class="box">
        <div class="slbl" style="margin-bottom:1rem">Forma de pagamento</div>
        <div id="pag-section">${buildPagHTML()}</div>
      </div>
    </div>

    <div class="box" style="margin-bottom:1.5rem">
      <div class="bxh">
        <div class="slbl">Evolução dos últimos 6 meses</div>
        <div class="eleg">
          <div class="eli"><div class="eld" style="background:var(--gr)"></div>Entradas</div>
          <div class="eli"><div class="eld" style="background:var(--rd)"></div>Saídas</div>
          <div class="eli"><div class="eld" style="background:var(--bl);border-radius:50%"></div>Saldo</div>
        </div>
      </div>
      <div style="position:relative;height:220px">
        <canvas id="ec" role="img" aria-label="Evolução mensal">Evolução dos últimos 6 meses.</canvas>
      </div>
    </div>

    <div class="box">
      <div class="bxh">
        <div class="slbl">Transações</div>
        <div style="font-size:11px;color:var(--mu);font-family:'DM Mono',monospace">${allTxn.length} registros</div>
      </div>
      <div class="tabs">
        <button class="tab ${tab==='reais'?'active':''}" onclick="setTab('reais')">Reais (${rows.length})</button>
        <button class="tab ${tab==='todas'?'active':''}" onclick="setTab('todas')">Com parcelas (${rows.length+projs.length})</button>
      </div>
      <div class="txn-scroll"><div class="txn-list">${txnHTML}</div></div>
    </div>`;

  renderEvol();
}

function renderEvol(){
  const lb=[],ins=[],outs=[],sal=[];
  for(let i=5;i>=0;i--){
    let m=curM-i,y=curY;
    if(m<0){m+=12;y--;}
    const r=gm(m,y);
    const ti=r.filter(x=>x.tipo==='Entrada').reduce((s,x)=>s+x.valor,0);
    const to=r.filter(x=>x.tipo==='Saída').reduce((s,x)=>s+x.valor,0);
    lb.push(MSH[m]);ins.push(+ti.toFixed(2));outs.push(+to.toFixed(2));sal.push(+(ti-to).toFixed(2));
  }
  if(ec)ec.destroy();
  const ctx=document.getElementById('ec')?.getContext('2d');
  if(!ctx)return;
  ec=new Chart(ctx,{
    type:'bar',
    data:{labels:lb,datasets:[
      {label:'Entradas',data:ins,backgroundColor:'rgba(0,229,160,.2)',borderColor:'rgba(0,229,160,.5)',borderWidth:1,borderRadius:6},
      {label:'Saídas',data:outs,backgroundColor:'rgba(255,77,109,.2)',borderColor:'rgba(255,77,109,.5)',borderWidth:1,borderRadius:6},
      {label:'Saldo',data:sal,type:'line',borderColor:'#4d9fff',backgroundColor:'rgba(77,159,255,.08)',borderWidth:2,pointBackgroundColor:'#4d9fff',pointRadius:4,tension:.4,fill:true}
    ]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>' '+c.dataset.label+': '+fmt(c.parsed.y)},backgroundColor:'#1a1a24',borderColor:'rgba(255,255,255,.1)',borderWidth:1,titleColor:'#f0f0f5',bodyColor:'#6b6b80',padding:10}},
      scales:{
        x:{ticks:{color:'#6b6b80',font:{size:11,family:'DM Mono'}},grid:{color:'rgba(255,255,255,.04)'},border:{display:false}},
        y:{ticks:{color:'#6b6b80',font:{size:11,family:'DM Mono'},callback:v=>'R$'+(v/1000).toFixed(0)+'k'},grid:{color:'rgba(255,255,255,.04)'},border:{display:false}}
      }
    }
  });
}

function chM(d){curM+=d;if(curM>11){curM=0;curY++;}if(curM<0){curM=11;curY--;}render();}
function setTab(t){tab=t;render();}
async function recarregar(){toast('Atualizando...');await load();}

API=localStorage.getItem('finApi')||'';
API?load():showSetup();
</script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(function(){});
}
</script>
</body>
</html>
